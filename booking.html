<!doctype html>
<html lang="sv">
  <html>
    <head>
      <meta charset="utf-8" />
      <title>Booking</title>
    </head>
    <body>
      <header>
        <nav>
          <a href="index.html">Start</a>
          <a href="meny.html">Meny</a>
          <a href="booking.html">Boka bord</a>
        </nav>
      </header>
      <main>
        <h1>Boka bord</h1>
        <p>Fyll i formuläret så hör vi av oss och bekräftar tid</p>

        <form>
          <p>
            <label for="name">Namn</label>
            <input type="name" id="name" required />
          </p>
          <p>
            <label for="email">e-post</label>
            <input type="email" id="email" required />
          </p>
          <p>
            <label for="date">Datum</label>
            <input type="date" id="date" required />
          </p>
          <p>
            <label for="service">Tid</label>
            <select id="service">
              <option>09.00</option>
              <option>10.00</option>
              <option>11.00</option>
              <option>12.00</option>
              <option>13.00</option>
              <option>14.00</option>
              <option>15.00</option>
              <option>16.00</option>
            </select>
          </p>
        </form>
        <p>
          <label for="count">Hur många kommer ni?</label>
          <input type="number" id="count" />
        </p>
        <p>
          <label for="message">Medelande?</label>
          <textarea id="message"></textarea>
        </p>
        <p>
          <button>Skicka bokning</button>
        </p>

        <footer></footer>
      </main>
    </body>
  </html>
</html>
